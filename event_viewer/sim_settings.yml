# sim_settings.yml
#
# Paths configuration for the event_viewer against siwecal_k4sim simulation
# data. Loaded automatically by launch_sim.sh via the SIWECAL_SETTINGS env var.
#
# Relative paths resolve against the repo root (siwecal_k4sim).

data_dir:
  - ./gaudi_jobs

geometry_dir: ./mappings

pid_dir: null
cache_dir: null
output_dir: ./analysis/output
