    adc_high_max: 1932.8
    adc_high_max_source: roll-over fitted to ecal_TB2026CERN_run_000013.root (hit_lg-vs-hit_hg,
      1018058 hits)
    saturation_adc: 1500.0
    saturation_order: 5.66
    gain_ratio: 0.0961
