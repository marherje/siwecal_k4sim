_comment: "Per-threshold digitisation calibration. ONE file, read by gaudi_jobs/pid2026_common/job3_digitize.py through CALIB_THRESHOLD.\n\
  Nothing here is inherited from another threshold set: each one is anchored to test-beam data of its own set.\n  threshold_adc\
  \ / sigma_mip / efficiency : the trigger, fitted from hitbit_high by analysis/trigger_turnon.py\n  adc_per_mip         \
  \                   : the absolute ADC scale, the gain: ONE value for all sets (the preamp gain does not depend on the trigger\
  \ DAC), measured on the set whose discriminator sits below the MIP peak (th210); see adc_per_mip_source\n  adc_high_max\
  \ / saturation_order        : the dynamic range, the roll-over fitted to that set's ELECTRON hit_lg-vs-hit_hg relation (analysis/compare_gains.py\
  \ --write)\nThe trigger threshold RealDigitizer applies is threshold_adc / adc_per_mip.\nHit selection: the data trees these\
  \ were fitted against use EcalEventBuilder HitSelection=adc (hit bit OR adc-ped > 30, largest SCA) and the simulation HIT_SELECTION=chip,\
  \ the same rule.\nslab_overrides: the turn-on of EVERY slab (since 2026-10-07; before, only slabs > 3 sigma from the others,\
  \ e.g. slab 12 the FEV11 chip-on-board at DAC 243), measured per slab from hitbit_high; RealDigitizer gets them as ThresholdPerLayer\
  \ / FastNoiseMIPPerLayer / TriggerEfficiencyPerLayer.\n2026-09-30: trigger model re-measured on the fixed-SCA-pairing chunks;\
  \ electronic noise per cell from the fixed pedestal tables (PED_NOISE=1 in job3_digitize.py) instead of RealDigitizer SlowNoiseMIP."
thresholds:
  th210:
    threshold_adc: 16.11
    sigma_mip: 0.1708
    efficiency: 0.9901
    turnon_source_run: TB2026CERN_eudaq_run_000253
    adc_per_mip: 18.75
    adc_per_mip_source: 'ONE gain for the three sets (the preamplifier does not know the trigger DAC), re-measured 2026-09-30
      on th210 muons (eudaq 151, adc hit selection, fixed SCA pairing, fixed th210 pedestals; that tree was deleted 2026-10-13, the hit-bit one is Reconstruction/TB2026CERN_eudaq_run_000151) against a 150 GeV
      muon sample with the run-151 beam profile, digitised with per-cell pedestal noise and the measured 3.2 % gain spread:
      Landau-MPV match 18.75, spectrum-shape chi2 minimum 18.54 (486/63 bins), tag-and-probe layer efficiency 19.63 (depends
      on the trigger model: open systematic). The previous 19.5 was set on the SCA-mixed data, whose muon peak was wider than
      any simulation.'
    adc_per_mip_per_set_2026_09_18: 19.07
