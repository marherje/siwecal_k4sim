_comment: "Per-threshold digitisation calibration. ONE file, read by gaudi_jobs/pid2026_common/job3_digitize.py\
  \ through CALIB_THRESHOLD.\nNothing here is inherited from another threshold set:\
  \ each one is anchored to test-beam data of its own set.\n  threshold_adc / sigma_mip\
  \ / efficiency : the trigger, fitted from hitbit_high by analysis/trigger_turnon.py\n\
  \  adc_per_mip                            : the absolute ADC scale, the gain: ONE value\
  \ for all sets (the preamp gain does not depend on the trigger DAC), measured on the set whose\
  \ discriminator sits below the MIP peak (th210); see adc_per_mip_source\n  adc_high_max / saturation_order        : the dynamic\
  \ range, the roll-over fitted to that set's ELECTRON hit_lg-vs-hit_hg relation (analysis/compare_gains.py\
  \ --write)\nThe trigger threshold RealDigitizer applies is threshold_adc / adc_per_mip.\n\
  Hit selection: the data trees these were fitted against use EcalEventBuilder HitSelection=adc\
  \ (hit bit OR adc-ped > 30, largest SCA) and the simulation HIT_SELECTION=chip,\
  \ the same rule.\nslab_overrides: slabs that ran at a discriminator of their own\
  \ (slab 12, the FEV11 chip-on-board, at DAC 243), measured per slab from hitbit_high;\
  \ RealDigitizer gets them as ThresholdPerLayer / FastNoiseMIPPerLayer / TriggerEfficiencyPerLayer."
thresholds:
  th210:
    threshold_adc: 16.26
    sigma_mip: 0.1503
    efficiency: 0.9643
    turnon_source_run: TB2026CERN_eudaq_run_000253
    adc_per_mip: 19.5
    adc_per_mip_source: 'ONE gain for the three sets, 19.5 ADC/MIP: the preamplifier does not know the trigger DAC. Measured where the discriminator sits below the MIP peak (th210, eudaq 151): spectrum-shape chi2 with both Poisson variances 19.1, tag-and-probe layer efficiency of muon tracks 19.7, and the th230 table bias x1.47 needs a threshold at 1.35 MPV = 18.8 ADC/MIP. The per-set scans (19.07 / 21.33 / 22.39, 2026-09-18) were not measurements above the MIP: at th230 the Pearson chi2 of muon_gain_scan.py equalled the simulation''s own Poisson noise floor for gains 19-23, and at th220 the value tracked the 0.85 plateau measured on showers. 2026-09-22'
    adc_per_mip_per_set_2026_09_18: 19.07
    adc_high_max: 1950.6
    adc_high_max_source: roll-over fitted to ecal_TB2026CERN_eudaq_run_000286.root
      (hit_lg-vs-hit_hg, 784270 hits)
    saturation_adc: 1500.0
    saturation_order: 4.77
    gain_ratio: 0.0925
    gain_intercept: 2.24
    slab_overrides:
      0:
        threshold_adc: 18.03
        sigma_adc: 2.82
        efficiency: 0.9963
        turnon_source_run: TB2026CERN_eudaq_run_000253
      12:
        threshold_adc: 24.15
        sigma_adc: 3.89
        efficiency: 0.9966
        turnon_source_run: TB2026CERN_eudaq_run_000253
    slab_overrides_source: 'analysis/trigger_turnon.py --per-slab: slabs whose discriminator
      level sits > 3 sigma (of the per-slab scatter) from the all-slab fit; threshold/sigma
      in ADC, turned into MIP with this set''s adc_per_mip'
    lg_noise_adc: 3.48
    lg_gain_spread: 0.0698
    lg_scatter_source: robust width of hit_lg about the anchor line in bins of hit_hg,
      ecal_TB2026CERN_eudaq_run_000286.root (6416796 hits, 30-1400 ADC)
  th220:
    threshold_adc: 19.67
    sigma_mip: 0.1654
    efficiency: 0.8522
    turnon_source_run: TB2026CERN_run_000072
    adc_per_mip: 19.5
    adc_per_mip_source: 'ONE gain for the three sets, 19.5 ADC/MIP: the preamplifier does not know the trigger DAC. Measured where the discriminator sits below the MIP peak (th210, eudaq 151): spectrum-shape chi2 with both Poisson variances 19.1, tag-and-probe layer efficiency of muon tracks 19.7, and the th230 table bias x1.47 needs a threshold at 1.35 MPV = 18.8 ADC/MIP. The per-set scans (19.07 / 21.33 / 22.39, 2026-09-18) were not measurements above the MIP: at th230 the Pearson chi2 of muon_gain_scan.py equalled the simulation''s own Poisson noise floor for gains 19-23, and at th220 the value tracked the 0.85 plateau measured on showers. 2026-09-22'
    adc_per_mip_per_set_2026_09_18: 21.33
    adc_high_max: 1916.8
    adc_high_max_source: roll-over fitted to ecal_TB2026CERN_run_000072.root (hit_lg-vs-hit_hg,
      963425 hits)
    saturation_adc: 1500.0
    saturation_order: 6.0
    gain_ratio: 0.0963
    gain_intercept: 1.29
    slab_overrides:
      12:
        threshold_adc: 30.09
        sigma_adc: 4.94
        efficiency: 0.9295
        turnon_source_run: TB2026CERN_run_000072
    slab_overrides_source: 'analysis/trigger_turnon.py --per-slab: slabs whose discriminator
      level sits > 3 sigma (of the per-slab scatter) from the all-slab fit; threshold/sigma
      in ADC, turned into MIP with this set''s adc_per_mip'
    lg_noise_adc: 3.54
