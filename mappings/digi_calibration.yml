    slab_overrides_source: 'analysis/trigger_turnon.py --per-slab: slabs whose discriminator
      level sits > 3 sigma (of the per-slab scatter) from the all-slab fit; threshold/sigma
      in ADC, turned into MIP with this set''s adc_per_mip'
    lg_noise_adc: 4.04
    lg_gain_spread: 0.0693
    lg_scatter_source: robust width of hit_lg about the anchor line in bins of hit_hg,
      ecal_TB2026CERN_run_000013.root (8313380 hits, 30-1400 ADC)
