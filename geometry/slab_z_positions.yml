# slab_z_positions.yml  (simulation geometry version)
#
# Physical z position (mm) of each silicon sensor layer in the siwecal_k4sim
# DD4hep simulation.  These are the CalorimeterHit.position.z values returned
# by Geant4 (global coordinate system, centred on the detector envelope).
#
# Used by the event_viewer to render the detector-plane overlay.
# Compare with slab_z_positions_sim.yml (identical content; both kept for
# compatibility with tools that look for the default filename).
#
# w_thickness_mm: W absorber upstream of each slab (same profile as the
# real SiW-ECAL detector).

slab_z_mm:
  - -116.35   # slab  0  (2.8 mm W)
  - -99.75    # slab  1  (4.2 mm W)
  - -83.15    # slab  2  (4.2 mm W)
  - -66.55    # slab  3  (4.2 mm W)
  - -49.95    # slab  4  (4.2 mm W)
  - -33.35    # slab  5  (4.2 mm W)
  - -16.75    # slab  6  (4.2 mm W)
  - -0.15     # slab  7  (4.2 mm W)
  - 16.45     # slab  8  (5.6 mm W)
  - 33.05     # slab  9  (5.6 mm W)
  - 49.65     # slab 10  (5.6 mm W)
  - 77.25     # slab 11  (5.6 mm W)
  - 93.85     # slab 12  (5.6 mm W)
  - 110.45    # slab 13  (5.6 mm W)
  - 126.98    # slab 14  (5.6 mm W)

w_thickness_mm:
  - 2.8
  - 4.2
  - 4.2
  - 4.2
  - 4.2
  - 4.2
  - 4.2
  - 4.2
